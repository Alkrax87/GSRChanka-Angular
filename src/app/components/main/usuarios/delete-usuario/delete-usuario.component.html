<div class="form-container">
  <div class="container-fluid">
    <div class="row">
      <div class="col-11">
        <h5>Editar Usuario</h5>
      </div>
      <div class="col-1">
        <button type="button" class="option-close" (click)="close()"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="text-center">
          <p>¿Estás seguro de que deseas eliminar esta Area?</p>
        </div>
        <div class="d-flex justify-content-around">
          <button class="option-button" type="button" (click)="close()"><i class="fa-solid fa-arrow-turn-up rotate"></i>&nbsp;&nbsp;Cancelar</button>
          <button class="option-button" type="button" (click)="deleteUser()"><i class="fas fa-user-times"></i>&nbsp;&nbsp;Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</div>
