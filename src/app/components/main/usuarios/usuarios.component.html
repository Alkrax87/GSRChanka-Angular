<div class="container-fluid full-content">
  <p class="route">Usuarios</p>
  <h3 class="title">Usuarios</h3>
  <div class="user-container">
    <div class="container-fluid">
      <div class="row">
        <div class="col">
          <button class="btn btn-success" type="button" (click)="addUserModal()"><i class="fa-solid fa-user-plus"></i>&nbsp;&nbsp;Agregar</button>
        </div>
      </div>
    </div>
    <div class="container-fluid">
      <div class="row">
        @for (item of items; track $index) {
          <div class="col-lg-3 col-md-6 col-sm-12">
            <div class="user-card my-3">
              <div class="user-card-bg">
                <img src="https://picsum.photos/400/85" class="img-fluid">
              </div>
              <div class="user-card-logo">
                <div class="profile">
                  <img src="https://avatar.iran.liara.run/public" class="rounded-circle">
                </div>
              </div>
              <div class="mt-5 text-center">
                <h5 class="mb-0 text-nowrap">{{ item.name + ' ' + item.lastname }}</h5>
                <span class="text-muted d-block mb-0">{{ item.rol }}</span>
              </div>
              <div class="d-flex justify-content-around align-items-center mt-2 px-4">
                <div>
                  <button class="btn user-options show" (click)="showUserModal(item)"><i class="fas fa-user"></i></button>
                </div>
                <div>
                  <button class="btn user-options edit" (click)="editUserModal(item)"><i class="fas fa-user-edit"></i></button>
                </div>
                <div>
                  <button class="btn user-options delete" (click)="removeUserModal(item.id)"><i class="fas fa-user-times"></i></button>
                </div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
